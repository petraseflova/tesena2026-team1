name: Enhancement
description: Improve the test framework, CI or documentation
title: '[Enhancement]: '
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Test framework (clients, fixtures, data, schemas, reporters, utils)
        - CI workflow
        - Tooling (lint, format, git hooks)
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
